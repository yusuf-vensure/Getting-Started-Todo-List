<main style="padding: 2rem; font-family: sans-serif;">
  <!-- Signal Interpolation -->
  <h1>Welcome to {{ title() }}</h1> 

  <section style="margin-bottom: 2rem;">
    <h2>Database Stats</h2>
    <!-- Angular Control Flow (Like Django's {% if %}) -->
    @if (viewCount !== 'Loading...') {
      <p>Total Page Views: <strong>{{ viewCount }}</strong></p>
    } @else {
      <p><em>Loading stats from MSSQL...</em></p>
    }
  </section>

  <section>
    <h2>Add a New User</h2>
    <!-- Event Binding to your onSubmit() function -->
    <form (ngSubmit)="onSubmit()">
      <!-- Two-Way Data Binding -->
      <input 
        type="text" 
        [(ngModel)]="userName" 
        name="userName" 
        placeholder="Enter a name" 
        required 
        style="padding: 0.5rem; margin-right: 0.5rem;"
      >
      <button type="submit" style="padding: 0.5rem 1rem;">Save to Database</button>
    </form>
  </section>
</main>
